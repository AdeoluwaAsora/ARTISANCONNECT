server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router handles routing client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML shell (so deploys are picked up immediately)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache hashed static assets aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse proxy API calls to the backend container by service name
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy SignalR hubs, with WebSocket upgrade support
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}